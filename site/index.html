<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浮笺 — 桌面待办便签</title>
    <meta
      name="description"
      content="浮笺是一个无边框的桌面任务便签。只显示标题，点击展开备注；也可以记录随记。支持 Windows 与 macOS。"
    />
    <meta property="og:title" content="浮笺 — 桌面待办便签" />
    <meta property="og:description" content="只显示标题的桌面任务便签，支持随记与多设备同步。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/tasks-light.webp" />
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="download.js" defer></script>
  </head>
  <body>
    <header class="nav-bar">
      <div class="nav-inner">
        <a class="brand" href="/" aria-label="浮笺首页">
          <img src="assets/icon.png" alt="" width="24" height="24" />
          <span>浮笺</span>
        </a>
        <nav class="nav-links" aria-label="主导航">
          <a href="#product">产品</a>
          <a href="#download">下载</a>
          <a href="https://github.com/RYMegumi/floating-notes-public" rel="noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">浮笺</p>
        <h1>桌面待办便签</h1>
        <p class="hero-copy">
          只显示标题，点击展开备注。也可以在同一处记录随记。
        </p>
        <div class="hero-actions">
          <a
            class="button button-primary"
            data-download
            href="https://github.com/RYMegumi/floating-notes-public/releases/latest"
            rel="noreferrer"
          >
            下载 Windows 版
          </a>
          <a class="button button-quiet" href="#product">了解功能</a>
        </div>
        <p class="hero-meta">Windows 10 / 11 · macOS · 无需安装</p>
      </section>

      <section class="products" id="product" aria-label="产品功能">
        <article class="product-card">
          <div class="product-media">
            <img
              src="assets/tasks-light.webp"
              alt="浮笺待办列表，浅色玻璃效果"
              width="928"
              height="732"
            />
          </div>
          <div class="product-copy">
            <h2>待办</h2>
            <p>按重要和紧急排序，支持归档、恢复和专注模式。</p>
          </div>
        </article>

        <article class="product-card">
          <div class="product-media product-media--notes">
            <img
              src="assets/notes-light.webp"
              alt="浮笺随记列表，浅色玻璃效果"
              width="928"
              height="1374"
            />
          </div>
          <div class="product-copy">
            <h2>随记</h2>
            <p>记录临时想法，编辑关键词，登录后与任务一起同步。</p>
          </div>
        </article>
      </section>

      <section class="download" id="download" aria-labelledby="download-title">
        <div>
          <h2 id="download-title">下载浮笺</h2>
          <p>选择适合当前系统的版本。</p>
        </div>
        <div class="download-actions">
          <a
            class="button button-primary"
            data-download
            href="https://github.com/RYMegumi/floating-notes-public/releases/latest"
            rel="noreferrer"
          >
            下载 Windows 版
          </a>
          <a
            class="download-all"
            href="https://github.com/RYMegumi/floating-notes-public/releases/latest"
            rel="noreferrer"
          >
            查看全部版本
          </a>
          <p class="download-meta">
            <span data-platform-label>Windows 10 / 11</span>
            <span data-release-version>1.3.0</span>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p>浮笺 · 桌面待办便签</p>
        <div class="footer-links">
          <a href="privacy.html">隐私</a>
          <a href="https://github.com/RYMegumi/floating-notes-public" rel="noreferrer">源代码</a>
        </div>
      </div>
    </footer>
  </body>
</html>
